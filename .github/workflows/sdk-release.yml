name: Publish React SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate, for example v1.2.3
        required: true
        default: v0.0.0-rc.1
        type: string

jobs:
  # Runs unconditionally (release or workflow_dispatch dry run), with no
  # publish rights — everything here is safe for anyone who can trigger
  # this workflow to see run.
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_version.outputs.tag }}
      version: ${{ steps.release_version.outputs.version }}
      dist_tag: ${{ steps.release_version.outputs.dist_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Derive release version
        id: release_version
        # See clients.yml's identical step for why these are passed via
        # env rather than interpolated directly into the script.
        env:
          RAW_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RAW_INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${{ github.event_name }}" == 'release' ]]; then
            TAG_NAME="$RAW_RELEASE_TAG_NAME"
          else
            TAG_NAME="$RAW_INPUT_RELEASE_TAG"
          fi

          VERSION="${TAG_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "Release tag is empty"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$TAG_NAME' is not a supported semver tag"
            exit 1
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pre-releases (1.2.3-rc.1) go to the `next` dist-tag; npm refuses
          # to publish them without one.
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: ./sdk
        run: npm ci

      - name: Stamp package version from release tag
        working-directory: ./sdk
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Test and build package
        working-directory: ./sdk
        env:
          DIST_TAG: ${{ steps.release_version.outputs.dist_tag }}
        run: |
          npm test
          npm run build
          npm publish --dry-run --access public --tag "$DIST_TAG"

  # Separate job so an environment protection rule (required reviewers)
  # can gate it; `npm-publish` has none today, so it runs right away.
  #
  # Publishes with npm trusted publishing (OIDC, `id-token: write`): no npm
  # token is stored. One-time setup on npmjs.com, package settings ->
  # Trusted publisher -> GitHub Actions: owner jmaister, repository
  # taronja-gateway, workflow sdk-release.yml, environment npm-publish.
  publish:
    needs: build-and-test
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: ./sdk
        run: npm ci

      - name: Stamp package version from release tag
        working-directory: ./sdk
        env:
          RELEASE_VERSION: ${{ needs.build-and-test.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Build package
        working-directory: ./sdk
        run: npm run build

      - name: Publish package to npm
        working-directory: ./sdk
        env:
          DIST_TAG: ${{ needs.build-and-test.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

  report-dry-run:
    needs: build-and-test
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report dry run result
        env:
          RELEASE_TAG: ${{ needs.build-and-test.outputs.tag }}
        run: |
          echo "Dry run completed for $RELEASE_TAG"
          echo "npm publish was skipped because this was a manual workflow run"
