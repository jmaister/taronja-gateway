name: Generate and Update Clients

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate, for example v1.2.3
        required: true
        default: v0.0.0-rc.1
        type: string

jobs:
  # Runs unconditionally (release or workflow_dispatch dry run), with no
  # access to CLIENTS_REPO_TOKEN — generating the clients and, for a dry
  # run, reporting on them locally is safe for anyone who can trigger this
  # workflow to see run. Only the real repo (checkout-with-token, commit,
  # push, tag) is gated behind the publish-clients job below.
  generate-clients:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_version.outputs.tag }}
      version: ${{ steps.release_version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive release version
        id: release_version
        # RAW_RELEASE_TAG_NAME/RAW_INPUT_RELEASE_TAG are passed via env
        # rather than interpolated directly into this script (the
        # ${{ github.event.release.tag_name }}/${{ inputs.release_tag }}
        # pattern): both come from whoever created the release or
        # triggered this workflow, and interpolating a GitHub Actions
        # expression straight into a run: block lets a value containing
        # shell metacharacters (backticks, $(), quotes) execute as part of
        # this script rather than just being read as a string. Reading it
        # from an env var instead keeps it as inert data, no matter what
        # it contains.
        env:
          RAW_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RAW_INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${{ github.event_name }}" == 'release' ]]; then
            TAG_NAME="$RAW_RELEASE_TAG_NAME"
          else
            TAG_NAME="$RAW_INPUT_RELEASE_TAG"
          fi

          VERSION="${TAG_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "Release tag is empty"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$TAG_NAME' is not a supported semver tag"
            exit 1
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure temp and repo folders exist
        run: |
          mkdir -p ./clients-temp/go/

      # Set up environments for code generation
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sdk/package-lock.json
            webapp/package-lock.json


      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build and test React SDK
        working-directory: ./sdk
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          npm install
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm test
          npm run build

      # Step 1: Generate Clients to a temporary directory
      - name: Generate all clients
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen -config api/cfg_client.yaml api/taronja-gateway-api.yaml

      - name: Prepare local clients mirror for dry run
        run: |
          mkdir -p ./clients-repo/go/
          mkdir -p ./clients-repo/react/

      # Copied here too (not just in publish-clients below) so a dry run
      # actually demonstrates what would be synced, not just that codegen
      # ran without error. See publish-clients' identical step for why
      # session.go is excluded.
      - name: Copy generated code to local clients mirror
        run: |
          rsync -av --delete --exclude='go.mod' --exclude='go.sum' --exclude='session.go' --exclude='session_test.go' ./clients-temp/go/ ./clients-repo/go/
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='.github' \
            ./sdk/ ./clients-repo/react/

      - name: Report dry run result
        if: ${{ github.event_name != 'release' }}
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          echo "Dry run completed for $RELEASE_TAG"
          echo "Generated clients were copied into ./clients-repo without pushing changes"

  # Separate job, not just a conditional step in generate-clients, because
  # GitHub Environment protection rules (required reviewers) only ever
  # gate at the job level. Rebuilds the clients from scratch rather than
  # sharing generate-clients' workspace (a fresh runner starts with
  # nothing) — simpler and more robust than passing the generated
  # directories between jobs via actions/upload-artifact for a generation
  # step this fast and fully deterministic from the tagged commit alone.
  #
  # environment: clients-repo-publish only actually gates anything once a
  # required reviewer is configured for that environment name in this
  # repo's Settings -> Environments -> clients-repo-publish -> "Required
  # reviewers". Until that one-time setup happens, referencing an
  # environment with no protection rules has no effect and this job runs
  # immediately, same as before this existed — see the needs-validation
  # item this closes in the security audit for why Write-level repo access
  # (not just Admin) can trigger this today, and why that setup is worth
  # doing, along with confirming CLIENTS_REPO_TOKEN itself is scoped to
  # just the one mirror repo.
  publish-clients:
    needs: generate-clients
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: clients-repo-publish
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure temp folder exists
        run: |
          mkdir -p ./clients-temp/go/

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sdk/package-lock.json
            webapp/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build React SDK
        working-directory: ./sdk
        env:
          RELEASE_VERSION: ${{ needs.generate-clients.outputs.version }}
        run: |
          npm install
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm run build

      - name: Generate all clients
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen -config api/cfg_client.yaml api/taronja-gateway-api.yaml

      - name: Checkout clients repository
        uses: actions/checkout@v6
        with:
          repository: jmaister/taronja-gateway-clients
          path: ./clients-repo
          token: ${{ secrets.CLIENTS_REPO_TOKEN }}

      - name: Ensure clients repository folders exist
        run: |
          mkdir -p ./clients-repo/go/
          mkdir -p ./clients-repo/react/

      # --exclude='session.go': hand-written, not generated (see that
      # file's own top-of-file comment) — Session is never a
      # request/response body in api/taronja-gateway-api.yaml (it only
      # ever appears inside the X-User-Data header value on requests this
      # gateway proxies to other services), so oapi-codegen never produces
      # it in ./clients-temp/go/ for this rsync to mirror. Without this
      # exclude, --delete would silently remove it from the clients
      # repository on the very next release.
      - name: Copy generated code to clients repository
        run: |
          rsync -av --delete --exclude='go.mod' --exclude='go.sum' --exclude='session.go' --exclude='session_test.go' ./clients-temp/go/ ./clients-repo/go/
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='.github' \
            ./sdk/ ./clients-repo/react/

      - name: Commit and push changes
        env:
          RELEASE_TAG: ${{ needs.generate-clients.outputs.tag }}
        run: |
          cd ./clients-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No client changes to commit"
          else
            git commit -m "chore(release): sync clients for $RELEASE_TAG"
            git push
          fi

          for tag_name in \
            "$RELEASE_TAG" \
            "go/$RELEASE_TAG" \
            "react/$RELEASE_TAG"
          do
            if git ls-remote --exit-code --tags origin "$tag_name" >/dev/null 2>&1; then
              echo "Tag $tag_name already exists in clients repository"
              continue
            fi

            git tag "$tag_name"
            git push origin "$tag_name"
          done
