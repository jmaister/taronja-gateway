name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate, for example v1.2.3
        required: true
        default: v0.0.0-rc.1
        type: string

jobs:
  # Runs unconditionally (release or workflow_dispatch dry run) — builds
  # and smoke-tests the image with push:false, so a broken Dockerfile (a
  # removed apk package, an incompatible base image bump, ...) is caught
  # the same way for anyone who can trigger this workflow, before publish
  # ever runs.
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_version.outputs.tag }}
      version: ${{ steps.release_version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Derive release version
        id: release_version
        # See clients.yml's identical step for why these are passed via
        # env rather than interpolated directly into the script.
        env:
          RAW_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RAW_INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${{ github.event_name }}" == 'release' ]]; then
            TAG_NAME="$RAW_RELEASE_TAG_NAME"
          else
            TAG_NAME="$RAW_INPUT_RELEASE_TAG"
          fi

          VERSION="${TAG_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "Release tag is empty"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$TAG_NAME' is not a supported semver tag"
            exit 1
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taronja-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=taronja-gateway
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release_version.outputs.version }}

      - name: Smoke test the built image
        # Matches the Dockerfile's own ENTRYPOINT/CMD — just confirms the
        # binary actually starts (catches e.g. a missing shared lib or a
        # CGO_ENABLED mismatch) rather than crashing before it can even
        # print its own help text.
        run: docker run --rm taronja-gateway:ci --help

  # Separate job so the two GHCR pushes (:VERSION and :latest) only ever
  # happen for a real release, never a workflow_dispatch dry run —
  # build-and-test's own build step already verified the Dockerfile
  # actually builds and runs.
  #
  # Uses the default, ephemeral GITHUB_TOKEN (scoped to just this run,
  # never persisted anywhere outside GitHub's control) rather than a
  # long-lived external secret like sdk-release.yml's NPM_TOKEN or
  # clients.yml's CLIENTS_REPO_TOKEN — so this doesn't need those two
  # workflows' extra "environment: ...-publish" gate, which exists
  # specifically to protect a credential that would otherwise remain
  # valid and exfiltratable long after the run ends. release.yml's own
  # goreleaser job publishes GitHub Releases the same ungated way, using
  # the same GITHUB_TOKEN, for the same reason.
  publish:
    needs: build-and-test
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jmaister/taronja-gateway:${{ needs.build-and-test.outputs.version }}
            ghcr.io/jmaister/taronja-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=taronja-gateway
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-and-test.outputs.version }}

  report-dry-run:
    needs: build-and-test
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report dry run result
        env:
          RELEASE_TAG: ${{ needs.build-and-test.outputs.tag }}
        run: |
          echo "Dry run completed for $RELEASE_TAG"
          echo "GHCR push was skipped because this was a manual workflow run"
