name: Go Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for GoReleaser to generate proper changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      # See ci.yml's "Generate Go API code and TypeScript client" step for
      # why this runs from inside webapp/ (after `npm install` there) rather
      # than a bare `npx --yes @hey-api/openapi-ts` from the repo root: the
      # bare form resolves its own isolated (and potentially incompatible)
      # typescript dependency instead of the one pinned in webapp/package.json.
      - name: Generate API client
        run: |
          cd webapp
          npm install
          npx @hey-api/openapi-ts -i ../api/taronja-gateway-api.yaml -o src/apiclient -c @hey-api/client-fetch

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: If you didn't add coverage-treemap.svg to extra_files in .goreleaser.yml,
      # you can upload it separately:
      - name: Upload coverage treemap to release
        uses: softprops/action-gh-release@v2
        with:
          files: coverage-treemap.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

