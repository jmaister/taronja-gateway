name: Go Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for GoReleaser to generate proper changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      # GoReleaser's before hooks (.goreleaser.yml) install, generate and
      # build the webapp; nothing here may modify tracked files, or
      # GoReleaser refuses to release a dirty tree.
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

