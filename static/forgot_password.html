{{define "content"}}
<p>Enter the email of your account and we will send you a link to choose a new password.</p>
<form method="POST" action="{{.Prefix}}/forgot-password">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Email}}" autocomplete="email" required autofocus>
    <button type="submit">Send reset link</button>
</form>
<div class="links"><a href="{{.Prefix}}/login">Back to login</a></div>
{{end}}
