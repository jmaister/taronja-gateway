{{define "content"}}
<form method="POST" action="{{.Prefix}}/reset-password">
    <input type="hidden" name="token" value="{{.Token}}">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
    <span class="muted">At least 8 characters. You will be signed out everywhere else.</span>
    <button type="submit">Set new password</button>
</form>
{{end}}
