{{define "content"}}
{{with .PayDone}}
{{if eq .Status "completed"}}
<p>Thank you! Your payment is confirmed.</p>
<a class="button" href="{{.Redirect}}">Continue</a>
{{else if eq .Status "expired"}}
<p>The payment wasn't completed.</p>
<a class="button" href="{{.Redirect}}">Back</a>
{{else}}
<meta http-equiv="refresh" content="2">
<p>Confirming your payment…</p>
<p class="muted">This page refreshes by itself.</p>
{{end}}
{{end}}
{{end}}
