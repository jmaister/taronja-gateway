version: 2

project_name: taronja-gateway

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # Build the webapp before building the Go binary
    - bash -c "cd sdk && npm install"
    - bash -c "cd sdk && npm run build"
    - bash -c "cd webapp && npm install"
    # Runs from inside webapp/, after the npm install just above — see
    # ci.yml's "Generate Go API code and TypeScript client" step for why:
    # a bare `npx --yes @hey-api/openapi-ts` from the repo root resolves
    # its own isolated `typescript` dependency, which can land on a
    # version incompatible with @hey-api/openapi-ts's own codegen. Running
    # it from webapp/ makes npm resolve the `@hey-api/openapi-ts`
    # devDependency already pinned in webapp/package.json instead.
    - bash -c "cd webapp && npx @hey-api/openapi-ts -i ../api/taronja-gateway-api.yaml -o src/apiclient -c @hey-api/client-fetch"
    - bash -c "cd webapp && npm run build"

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -tags=purego
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.buildOS={{.Os}} -X main.buildArch={{.Arch}}
    main: ./main.go
    binary: tg

archives:
  - id: default
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: jmaister
    name: taronja-gateway
  draft: false
  prerelease: auto
  # extra_files: no extra release assets

# The Docker image (ghcr.io/jmaister/taronja-gateway) is built and pushed
# by .github/workflows/docker-release.yml instead of goreleaser's own
# `dockers:` integration: that integration expects to hand a
# goreleaser-built binary to a Dockerfile, but this project's Dockerfile
# does its own full multi-stage source build (webapp, then the Go
# binary) — running that as a second, independent build in its own
# workflow (with GitHub Actions' layer cache) is simpler than trying to
# thread goreleaser's build artifact into it.

