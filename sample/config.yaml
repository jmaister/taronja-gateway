version: "1.0" # Config schema version. See "Config file versioning" in README.md.
name: Example Gateway Configuration
server:
  host: 127.0.0.1
  port: 8080
  url: http://localhost:8080
# tracing:
#   # Disabled by default. Creates an OpenTelemetry span per request,
#   # exported over OTLP/HTTP to a collector (an OpenTelemetry Collector,
#   # Jaeger, Tempo, Honeycomb, ...). Top-level, not under management: —
#   # see README.md's "Tracing" section and doc/middleware/tracing.md.
#   enabled: true
#   endpoint: localhost:4318   # OTLP/HTTP collector host:port, no scheme
#   insecure: true             # plain HTTP to endpoint; most local/self-hosted collectors need this
management:
  prefix: _
  logging: true
  compression: true    # brotli/zstd/gzip/deflate response compression, negotiated via Accept-Encoding
  analytics: true
  excludeStaticAssets: false  # set true to skip traffic-metrics collection for static assets (CSS/JS/images/fonts/...)
  session:
    secondsDuration: 86400  # Session duration in seconds (24 hours = 86400 seconds)
  admin:
    # Admin access to the dashboard
    # Only this user can access the /_/admin/ dashboard
    enabled: true
    username: admin
    password: admin123  # This will be automatically hashed for security
  rateLimiter:
    # Simple in-memory rate limiting (0 to disable)
    requestsPerMinute: 100   # general request rate limit per IP
    maxErrors: 20            # number of 401/404 errors before blocking
    blockMinutes: 15         # how long to block offending IPs    # optional scanner detection: paths that should never exist
    vulnerabilityScan:
      urls:
        - "/*.php"
        - "/.env"
      max404: 3              # block after three hits to watched paths
      blockMinutes: 15       # length of block for scanner IP
  cors:
    # Disabled by default (the dashboard is always served same-origin).
    # Enable only if a separately-hosted frontend needs to call the
    # management API directly.
    allowedOrigins:
      - "https://app.example.com"
    allowCredentials: true   # requires an explicit origin list, not "*"
# Optional: declare the global middleware chain explicitly (order + enabled
# flags), instead of the management.compression/cors/analytics/logging/
# rateLimiter flags above. When this section is present it fully replaces
# those flags. See doc/refactor01.md, AGENTS.md, and doc/middleware/ for
# details on each middleware. Note: listing "tracing" here only controls
# its *position* in the chain — actually exporting anything still needs
# the top-level tracing.enabled/endpoint above, since that's what starts
# the real OTLP exporter this middleware dispatches through.
# middleware:
#   global:
#     - name: tracing
#     - name: compression
#     - name: cors
#       cors:
#         allowedOrigins:
#           - "https://app.example.com"
#     - name: rate_limiter
#       rateLimiter:
#         requestsPerMinute: 100
#         maxErrors: 20
#         blockMinutes: 15
#     - name: ja4_fingerprint
#     - name: session_extraction
#     - name: traffic_metrics
#       trafficMetrics:
#         excludeStaticAssets: false
#     - name: logging
routes:
  - name: Favicon
    from: /favicon.ico
    toFile: ./sample/webfiles/favicon.ico
    static: true
  - name: V1 of the API
    from: /api/v1/*
    removeFromPath: "/api/v1/"
    to: https://jsonplaceholder.typicode.com
    options:
      cacheControlSeconds: 0  # No cache (sends "no-cache" header)
  - name: V2 of the API (authenticated)
    from: /api/v2/*
    removeFromPath: "/api/v2/"
    to: https://jsonplaceholder.typicode.com
    authentication:
      enabled: true
  - name: httpbin
    from: /api/httpbin/*
    removeFromPath: "/api/httpbin/"
    to: http://localhost:8081
  - name: httpbin-auth
    from: /api/httpbin-auth/*
    removeFromPath: "/api/httpbin-auth/"
    to: http://localhost:8081
    authentication:
      enabled: true
  - name: SPA App
    from: /app/*
    removeFromPath: "/app/"
    to: http://localhost:8090
    isSPA: true
    authentication:
      enabled: true
  - name: Static files
    from: /static
    toFolder: ./sample/webfiles
    static: true
  - name: FrontEnd Authenticated
    from: /secret
    toFolder: ./sample/webfiles/secret
    static: true
    authentication:
      enabled: true
  - name: FrontEnd
    from: /
    toFolder: ./sample/webfiles
    static: true
    options:
      cacheControlSeconds: 86400  # Cache for 1 day (86400 seconds)


authenticationProviders:
  basic:
    enabled: true
  google:
    clientId: ${GOOGLE_CLIENT_ID}
    clientSecret: ${GOOGLE_CLIENT_SECRET}
  github:
    clientId: ${GITHUB_CLIENT_ID}
    clientSecret: ${GITHUB_CLIENT_SECRET}
  # Microsoft, Facebook, and "Sign in with Apple" existed here but moved to
  # the wip/microsoft-apple-facebook-auth branch, untested — to come back
  # to later.

branding:
  logoUrl: /static/logo.png

geolocation:
  iplocateApiKey: ${IPLOCATE_IO_API_KEY}

notification:
  email:
    enabled: true
    host: 127.0.0.1
    port: 1025
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_FROM}
    fromName: ${SMTP_FROM_NAME}
  # Telegram delivery: uncomment and set a bot token from @BotFather to let
  # users link their gateway account to a Telegram chat (GET
  # /_/notifications/telegram/link) and receive notifications there too,
  # including tappable action buttons. See doc/notifications.md.
  # telegram:
  #   enabled: true
  #   botToken: ${TELEGRAM_BOT_TOKEN}
  # Outbound callback fired once when a user responds to a notification,
  # so the app that created it learns about the response without polling.
  # secret is optional but recommended — it HMAC-SHA256-signs each request
  # body (X-Taronja-Signature: sha256=<hex>) so the receiver can verify the
  # call actually came from this gateway. See doc/notifications.md.
  # responseWebhook:
  #   enabled: true
  #   url: https://your-app.example.com/webhooks/taronja-notifications
  #   secret: ${NOTIFICATION_WEBHOOK_SECRET}
