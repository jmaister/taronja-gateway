version: 1 # Config schema version. See "Config file versioning" in README.md.
name: Example Gateway Configuration
server:
  host: 127.0.0.1
  port: 8080
  url: http://localhost:8080
  # tls:
  #   # Disabled by default (plain HTTP). Enable to have the gateway
  #   # terminate HTTPS itself, on the same server.port above. Pick exactly
  #   # one certificate source below — certFile/keyFile and acme are
  #   # mutually exclusive. See README.md's "TLS / HTTPS" section for the
  #   # full certificate-format reference and a comparison of the two.
  #   enabled: true
  #
  #   # --- Option 1: your own certificate files ---
  #   certFile: /path/to/fullchain.pem
  #   keyFile: /path/to/privkey.pem
  #   # Renewing certFile/keyFile in place (e.g. via certbot) is picked up
  #   # automatically, with zero downtime — no restart or reload needed.
  #
  #   # --- Option 2: automatic certificates via ACME / Let's Encrypt ---
  #   # (comment out certFile/keyFile above if using this instead)
  #   # acme:
  #   #   domains: ["example.com", "www.example.com"]  # no wildcards
  #   #   email: admin@example.com                     # optional
  #   #   # cacheDir: .autocert-cache                   # default shown
  #   #   # Uncomment while testing, to avoid production rate limits —
  #   #   # staging certs aren't trusted by real browsers:
  #   #   # directoryURL: https://acme-staging-v02.api.letsencrypt.org/directory
  #
  #   # Plain-HTTP port that redirects every request to HTTPS (and, with
  #   # acme configured, also answers its "http-01" domain-validation
  #   # challenge). Defaults to 80 when tls.enabled and this key is
  #   # omitted; set to 0 to disable the redirect listener (e.g. if
  #   # something else already owns port 80).
  #   # redirectPort: 80
management:
  prefix: _
  logging: true
  compression: true    # gzip/deflate response compression, negotiated via Accept-Encoding
  analytics: true
  excludeStaticAssets: false  # set true to skip traffic-metrics collection for static assets (CSS/JS/images/fonts/...)
  session:
    secondsDuration: 86400  # Session duration in seconds (24 hours = 86400 seconds)
  admin:
    # Admin access to the dashboard
    # Only this user can access the /_/admin/ dashboard
    enabled: true
    username: admin
    password: admin123  # This will be automatically hashed for security
  rateLimiter:
    # Simple in-memory rate limiting (0 to disable)
    requestsPerMinute: 100   # general request rate limit per IP
    maxErrors: 20            # number of 401/404 errors before blocking
    blockMinutes: 15         # how long to block offending IPs    # optional scanner detection: paths that should never exist
    vulnerabilityScan:
      urls:
        - "/*.php"
        - "/.env"
      max404: 3              # block after three hits to watched paths
      blockMinutes: 15       # length of block for scanner IP
  cors:
    # Disabled by default (the dashboard is always served same-origin).
    # Enable only if a separately-hosted frontend needs to call the
    # management API directly.
    allowedOrigins:
      - "https://app.example.com"
    allowCredentials: true   # requires an explicit origin list, not "*"
# Optional: declare the global middleware chain explicitly (order + enabled
# flags), instead of the management.compression/cors/analytics/logging/
# rateLimiter flags above. When this section is present it fully replaces
# those flags. See doc/refactor01.md, AGENTS.md, and doc/middleware/ for
# details on each middleware.
# middleware:
#   global:
#     - name: compression
#     - name: cors
#       cors:
#         allowedOrigins:
#           - "https://app.example.com"
#     - name: rate_limiter
#       rateLimiter:
#         requestsPerMinute: 100
#         maxErrors: 20
#         blockMinutes: 15
#     - name: ja4_fingerprint
#     - name: session_extraction
#     - name: traffic_metrics
#       trafficMetrics:
#         excludeStaticAssets: false
#     - name: logging
routes:
  - name: Favicon
    from: /favicon.ico
    toFile: ./sample/webfiles/favicon.ico
    static: true
  - name: V1 of the API
    from: /api/v1/*
    removeFromPath: "/api/v1/"
    to: https://jsonplaceholder.typicode.com
    options:
      cacheControlSeconds: 0  # No cache (sends "no-cache" header)
  - name: V2 of the API (authenticated)
    from: /api/v2/*
    removeFromPath: "/api/v2/"
    to: https://jsonplaceholder.typicode.com
    authentication:
      enabled: true
  - name: httpbin
    from: /api/httpbin/*
    removeFromPath: "/api/httpbin/"
    to: http://localhost:8081
  - name: httpbin-auth
    from: /api/httpbin-auth/*
    removeFromPath: "/api/httpbin-auth/"
    to: http://localhost:8081
    authentication:
      enabled: true
  - name: SPA App
    from: /app/*
    removeFromPath: "/app/"
    to: http://localhost:8090
    isSPA: true
    authentication:
      enabled: true
  - name: Static files
    from: /static
    toFolder: ./sample/webfiles
    static: true
  - name: FrontEnd Authenticated
    from: /secret
    toFolder: ./sample/webfiles/secret
    static: true
    authentication:
      enabled: true
  - name: FrontEnd
    from: /
    toFolder: ./sample/webfiles
    static: true
    options:
      cacheControlSeconds: 86400  # Cache for 1 day (86400 seconds)


authenticationProviders:
  basic:
    enabled: true
  google:
    clientId: ${GOOGLE_CLIENT_ID}
    clientSecret: ${GOOGLE_CLIENT_SECRET}
  github:
    clientId: ${GITHUB_CLIENT_ID}
    clientSecret: ${GITHUB_CLIENT_SECRET}

branding:
  logoUrl: /static/logo.png

geolocation:
  iplocateApiKey: ${IPLOCATE_IO_API_KEY}

notification:
  email:
    enabled: true
    smtp:
      host: 127.0.0.1
      port: 1025
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      from: ${SMTP_FROM}
      fromName: ${SMTP_FROM_NAME}
