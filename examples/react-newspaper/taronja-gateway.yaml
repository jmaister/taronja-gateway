version: "1.0"
name: Newspaper (React)
server:
  host: 127.0.0.1
  port: 8080
  url: http://localhost:8080
management:
  admin:
    enabled: true
    username: admin
    password: admin123
middleware:
  - name: logging

routes:
  - name: Favicon
    from: /favicon.svg
    toFile: ./dist/favicon.svg
  - name: Private
    from: /premium/*
    toFolder: ./dist
    isSPA: true
    authenticated: true
  - name: Public
    from: /
    toFolder: ./dist
    isSPA: true


authenticationProviders:
  basic:
    enabled: true
  google:
    clientId: ${GOOGLE_CLIENT_ID}
    clientSecret: ${GOOGLE_CLIENT_SECRET}
  github:
    clientId: ${GITHUB_CLIENT_ID}
    clientSecret: ${GITHUB_CLIENT_SECRET}

notification:
  email:
    enabled: true
    host: 127.0.0.1
    port: 1025
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_FROM}
    fromName: ${SMTP_FROM_NAME}
