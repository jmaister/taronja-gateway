openapi: 3.0.0
info:
  title: Taronja Gateway API
  version: v1.0.0
  description: API for Taronja Gateway interal and public endpoints

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      security:
        - {}
        - cookieAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /logout:
    get:
        summary: Logs out the current user
        operationId: logoutUser
        tags:
            - User
        parameters:
            - in: cookie
              name: tg_session_token
              schema:
                type: string
              required: false
              description: Session token cookie for authentication
            - in: query
              name: redirect
              schema:
                type: string
              required: false
              description: URL to redirect to after successful logout
              example: "/login"
        responses:
            '302':
                description: Successfully logged out and redirected to root page, even if no redirect URL is provided, even if the user is not logged in
                headers:
                    Location:
                        schema:
                            type: string
                            example: "/"
                        description: URL to redirect to after logout
                    Set-Cookie:
                        schema:
                            type: string
                            example: "tg_session_token=; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=0"
                        description: Clears the session cookie by setting it to an empty value with immediate expiration
                    Cache-Control:
                        schema:
                            type: string
                            example: "no-store"
                        description: Prevents caching of the response
  /me:
    get:
      summary: Get current logged user information
      operationId: getCurrentUser
      tags:
        - User
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Information about the currently authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: true
                  username:
                    type: string
                    example: "testuser"
                  email:
                    type: string
                    format: email
                    example: "user@example.com"
                  name:
                    type: string
                    nullable: true
                    example: "Test User"
                  picture:
                    type: string
                    format: uri
                    nullable: true
                    example: "https://example.com/picture.jpg"
                  givenName:
                    type: string
                    nullable: true
                    example: "Test"
                  familyName:
                    type: string
                    nullable: true
                    example: "User"
                  provider:
                    type: string
                    example: "google"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2023-01-01T12:00:00Z"
                  isAdmin:
                    type: boolean
                    example: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /openapi.yaml:
    get:
      summary: Get OpenAPI specification of Taronja Gateway in YAML format
      operationId: getOpenApiYaml
      tags:
        - Documentation
      security:
        - {}
      responses:
        '200':
          description: OpenAPI specification in YAML format
          content:
            application/x-yaml:
              schema:
                type: string

  /api/users:
    get:
      summary: List all users
      operationId: listUsers
      tags:
        - User
      security:
        - cookieAuth: []
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - User
      # No security for user creation, as it's typically a public endpoint
      # If registration requires admin privileges or similar, add:
      # security:
      #   - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse' # Or a simpler success message
        '400':
          description: Bad Request (e.g., missing fields, invalid data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict (e.g., username or email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{userId}:
    get:
      summary: Get a user by ID
      operationId: getUserById
      tags:
        - User
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user to retrieve
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad Request (e.g. invalid user ID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/users/{userId}/tokens:
    get:
      summary: List API tokens for a specific user (admin only)
      operationId: listTokens
      tags:
        - Token
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user whose tokens to retrieve
          schema:
            type: string
      responses:
        '200':
          description: A list of user's tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized (not logged in or not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new API token for a specific user (admin only)
      operationId: createToken
      tags:
        - Token
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user for whom to create a token
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
      responses:
        '201':
          description: Token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (not logged in or not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tokens/{tokenId}:
    get:
      summary: Get token details (admin only)
      operationId: getToken
      tags:
        - Token
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          description: ID of the token to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Token details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized (not logged in or not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Revoke/delete a token (admin only)
      operationId: deleteToken
      tags:
        - Token
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          description: ID of the token to revoke
          schema:
            type: string
      responses:
        '204':
          description: Token successfully revoked
        '401':
          description: Unauthorized (not logged in or not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications:
    get:
      summary: List the current user's notifications, newest first
      operationId: listNotifications
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Max items to return. Defaults to 20, clamped to 100.
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: The `id` of the last item from a previous page, to fetch the next one. Omit for the first page.
          schema:
            type: string
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a notification for one or more users (server-to-server, admin only)
      description: >
        Called by the app the gateway sits in front of when something happens
        that the affected user(s) should be told about. One notification is
        created per entry in userIds, all sharing the same
        type/title/body/url/metadata/actions but each independently stored,
        delivered, read, and answered — notifying five people is one call,
        not five. Every notification always gets stored and is visible via
        GET /api/notifications regardless of channels; for each recipient,
        the channels named in this request (or, if omitted, that recipient's
        own preferred channel — see PUT /api/notifications/preferences — or,
        failing that, every configured channel) are attempted independently
        and best-effort — see NotificationDelivery in doc/notifications.md.
      operationId: createNotification
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Notification(s) created — one entry per userIds, in the same order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNotificationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (not logged in or not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/unread-count:
    get:
      summary: Get the current user's unread notification count (for a bell-icon badge)
      operationId: getUnreadNotificationCount
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/read-all:
    post:
      summary: Mark every one of the current user's notifications as read
      operationId: markAllNotificationsRead
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Marked read
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/{notificationId}/read:
    post:
      summary: Mark one notification as read
      operationId: markNotificationRead
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Marked read
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/{notificationId}/respond:
    post:
      summary: Answer one of a notification's actions, from the in-app list
      operationId: respondToNotification
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actionId:
                  type: string
              required:
                - actionId
      responses:
        '200':
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: This notification belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This notification already has a recorded response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: actionId doesn't name a real action on this notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/respond:
    get:
      summary: Answer one of a notification's actions, from an email link
      description: >
        Public and unauthenticated by design — an email's answer links have
        no session cookie to authenticate with, so the opaque `token` query
        parameter (present only in the email itself, never returned by any
        API) is the credential. Returns a small self-contained HTML
        confirmation page, not JSON, since this is meant to be opened
        directly in a browser from an email client.
      operationId: respondToNotificationByToken
      tags:
        - Notification
      security:
        - {}
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: action
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: An HTML confirmation (or error explanation) page
          content:
            text/html:
              schema:
                type: string

  /api/notifications/telegram/link:
    get:
      summary: Get a Telegram deep link to connect the current user's account
      description: >
        Returns a fresh, short-lived "https://t.me/<bot>?start=<code>" link —
        a frontend renders this as a button or QR code; opening it and
        pressing Start in Telegram connects that chat to the current user, so
        future notifications can be delivered there too.
      operationId: getTelegramLinkCode
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: A Telegram deep link
          content:
            application/json:
              schema:
                type: object
                properties:
                  deepLink:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                required:
                  - deepLink
                  - expiresAt
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Telegram delivery isn't configured on this gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/preferences:
    get:
      summary: Get the current user's preferred notification channel
      description: >
        "Each user can decide to receive notifications by one different
        provider" — this is that preference. Consulted by
        POST /api/notifications whenever a caller doesn't name explicit
        channels: this user's preferred one is used instead of every
        configured channel. Not validated against which channels this
        gateway currently has configured — an unconfigured or unknown
        preference just means every notification for this user is recorded
        as skipped on that channel, the same "skip, don't reject"
        philosophy the channels field on notification creation follows.
      operationId: getNotificationPreference
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The current preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Set (or clear) the current user's preferred notification channel
      operationId: setNotificationPreference
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreference'
      responses:
        '200':
          description: The updated preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/{notificationId}/deliveries:
    get:
      summary: Get one notification's full delivery history
      description: >
        Every attempt to deliver this notification over every external
        channel, newest first — including attempts superseded by a later
        automatic retry (see NotificationDelivery in doc/notifications.md).
        A channel with no attempts (e.g. it was never requested for this
        notification) simply has no entries here, rather than a "not
        attempted" placeholder.
      operationId: listNotificationDeliveries
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDelivery'
                required:
                  - deliveries
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: This notification belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/{notificationId}/status:
    get:
      summary: Get one notification's rolled-up status
      description: >
        A single "sent"/"failed"/"pending" answer, computed fresh from the
        notification's delivery attempts (worst-first across its
        channels), plus the per-channel breakdown behind it. See
        doc/notifications.md's "Status" section for the exact rollup rule.
      operationId: getNotificationStatus
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The notification's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: This notification belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/batches/{batchId}/status:
    get:
      summary: Get a rolled-up status count across every recipient of one create call (admin only)
      description: >
        A batch is every recipient notified together in one
        POST /api/notifications call (see batchId on Notification/
        CreateNotificationResponse) — even a single-recipient call gets
        one. Admin-only: a batch can span several different users' own
        notifications, so there's no single owning user this could be
        scoped to the way GET /api/notifications/{id}/status is; only the
        caller who created the batch (necessarily an admin) is in a
        position to ask "how did the whole thing go."
      operationId: getNotificationBatchStatus
      tags:
        - Notification
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The batch's rolled-up status counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationBatchStatus'
        '401':
          description: Unauthorized (not logged in or not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No notifications found for this batch ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/requests:
    get:
      summary: Get request statistics
      operationId: getRequestStatistics
      tags:
        - Statistics
      security:
        - cookieAuth: []
      parameters:
        - name: start_date
          in: query
          required: false
          description: Start date for filtering results (ISO 8601 format)
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00Z"
        - name: end_date
          in: query
          required: false
          description: End date for filtering results (ISO 8601 format)
          schema:
            type: string
            format: date-time
            example: "2025-12-31T23:59:59Z"
      responses:
        '200':
          description: Request statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatistics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/statistics/requests/details:
    get:
      summary: Retrieve detailed information about requests made to the gateway
      operationId: getRequestDetails
      tags:
        - Statistics
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date-time
          required: false
          description: Optional start date for filtering results (ISO 8601 format)
          example: "2025-01-01T00:00:00Z"
        - in: query
          name: end_date
          schema:
            type: string
            format: date-time
          required: false
          description: Optional end date for filtering results (ISO 8601 format)
          example: "2025-12-31T23:59:59Z"
        - in: query
          name: is_static
          schema:
            type: boolean
          required: false
          description: >-
            Optional filter on whether the request was for a static asset
            (see management.excludeStaticAssets). true returns only static
            asset requests, false returns only non-static requests, and
            omitting it returns both.
          example: false
      responses:
        '200':
          description: List of requests with detailed information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/timeseries:
    get:
      summary: >-
        Get request/visitor counts bucketed over time (per minute, hour,
        day, week, or month) — powers "traffic over time" style graphs.
      operationId: getRequestTimeSeries
      tags:
        - Statistics
      security:
        - cookieAuth: []
      parameters:
        - name: start_date
          in: query
          required: false
          description: Start date for the series (ISO 8601 format). Defaults to 24 hours before end_date.
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00Z"
        - name: end_date
          in: query
          required: false
          description: End date for the series (ISO 8601 format). Defaults to now.
          schema:
            type: string
            format: date-time
            example: "2025-01-02T00:00:00Z"
        - name: granularity
          in: query
          required: false
          description: >-
            Bucket size. Defaults to "day". Each is capped to a maximum
            start_date/end_date span, to keep the number of returned
            points bounded: minute (24 hours), hour (31 days), day (366
            days), week (2 years), month (5 years).
          schema:
            $ref: '#/components/schemas/TimeSeriesGranularity'
      responses:
        '200':
          description: Time-bucketed request/visitor counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesResponse'
        '400':
          description: >-
            Bad Request (unknown granularity, or start_date/end_date span
            exceeds that granularity's cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/statistics/rate-limiter:
    get:
      summary: Get current rate limiter statistics
      operationId: getRateLimiterStats
      tags:
        - Statistics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of rate limiter statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimiterStats'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rate-limiter/blocked:
    get:
      summary: >-
        Get the history of rate-limiter block events — a persistent
        registry that survives past the in-memory rate limiter's own
        cleanup, which discards an IP's live state (including its block)
        once the block expires and the IP goes quiet again.
      operationId: getBlockedClients
      tags:
        - Statistics
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: ip
          schema:
            type: string
          required: false
          description: Optional filter to only blocks recorded for this IP address
          example: "203.0.113.9"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          required: false
          description: Maximum number of block events to return
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          required: false
          description: Number of block events to skip
      responses:
        '200':
          description: Blocked-client history, most recently blocked first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedClientsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/config/rate-limiter:
    get:
      summary: Get current rate limiter configuration
      operationId: getRateLimiterConfig
      tags:
        - Configuration
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Rate limiter configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimiterConfigResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/middleware:
    get:
      summary: Get status (and health, where available) of every global middleware
      operationId: getMiddlewareStatus
      tags:
        - Middleware
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Status of all global middleware
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareStatusList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/middleware/metrics:
    get:
      summary: Get request metrics for every global middleware in one call
      operationId: getAllMiddlewareMetrics
      tags:
        - Middleware
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Request metrics for every middleware that has been built into the running chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareMetricsList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/middleware/{name}/metrics:
    get:
      summary: Get request metrics for a single global middleware
      operationId: getMiddlewareMetrics
      tags:
        - Middleware
      security:
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Middleware identifier, e.g. "rate_limiter" or "logging" (see getMiddlewareStatus)
          schema:
            type: string
          example: "rate_limiter"
      responses:
        '200':
          description: Request metrics for the named middleware
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiddlewareMetrics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown middleware name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/counters/{counterId}/{userId}:
    get:
      summary: Get user's current counter balance
      operationId: getUserCounters
      tags:
        - Counters
      security:
        - cookieAuth: []
      parameters:
        - name: counterId
          in: path
          required: true
          description: ID of the counter type (e.g., 'credits', 'coins', 'points')
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: ID of the user to get counter balance for
          schema:
            type: string
      responses:
        '200':
          description: User's current counter balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCountersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (user can only view own counters unless admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User or counter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add or deduct counter values for a user (admin only)
      operationId: adjustUserCounters
      tags:
        - Counters
      security:
        - cookieAuth: []
      parameters:
        - name: counterId
          in: path
          required: true
          description: ID of the counter type (e.g., 'credits', 'coins', 'points')
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: ID of the user to adjust counter for
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterAdjustmentRequest'
      responses:
        '200':
          description: Counter adjusted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterTransactionResponse'
        '400':
          description: Bad Request (invalid amount or insufficient balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User or counter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/counters/{counterId}/{userId}/history:
    get:
      summary: Get user's counter transaction history
      operationId: getUserCounterHistory
      tags:
        - Counters
      security:
        - cookieAuth: []
      parameters:
        - name: counterId
          in: path
          required: true
          description: ID of the counter type (e.g., 'credits', 'coins', 'points')
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: ID of the user to get counter history for
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          required: false
          description: Maximum number of transactions to return
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          required: false
          description: Number of transactions to skip
      responses:
        '200':
          description: User's counter transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterHistoryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (user can only view own history unless admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User or counter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/counters:
    get:
      summary: Get list of available counter types (admin only)
      operationId: getAvailableCounters
      tags:
        - Counters
        - Admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of available counter types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableCountersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/counters/{counterId}:
    get:
      summary: Get all users' counter balances (admin only)
      operationId: getAllUserCounters
      tags:
        - Counters
        - Admin
      security:
        - cookieAuth: []
      parameters:
        - name: counterId
          in: path
          required: true
          description: ID of the counter type (e.g., 'credits', 'coins', 'points')
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          required: false
          description: Maximum number of users to return
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          required: false
          description: Number of users to skip
      responses:
        '200':
          description: List of all users' counter balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllUserCountersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Counter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2023-10-01T12:00:00Z"
        uptime:
          type: string
          description: "Server uptime duration"
          example: "2h30m45s"
        database:
          type: object
          properties:
            status:
              type: string
              example: "ok"
            open_connections:
              type: integer
              description: "Number of open database connections"
              example: 5
          required:
            - status
      required:
        - status
        - timestamp
        - uptime
        - database
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: "Unauthorized"
      required:
        - code
        - message
    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          example: "newuser"
        email:
          type: string
          format: email
          example: "newuser@example.com"
        password:
          type: string
          format: password
          example: "securepassword123"
      required:
        - username
        - email
        - password
    UserResponse:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string # Assuming User ID is a string (e.g., UUID or from path)
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: string
          example: "testuser"
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          nullable: true
          example: "Test User"
        picture:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/picture.jpg"
        provider:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: When the user account was created.
        updatedAt:
          type: string
          format: date-time
          description: When the user account was last updated.
    RateLimiterStat:
      type: object
      required:
        - ip
        - requests
        - errors
        - scan404
        - blockedUntil
      properties:
        ip:
          type: string
          example: "192.168.1.1"
        requests:
          type: integer
          example: 120
        errors:
          type: integer
          example: 5
        scan404:
          type: integer
          example: 2
        blockedUntil:
          type: string
          format: date-time
          example: "2026-03-05T18:30:00Z"
    RateLimiterStats:
      type: array
      items:
        $ref: '#/components/schemas/RateLimiterStat'
    BlockedClient:
      type: object
      required:
        - id
        - ipAddress
        - reason
        - triggerCount
        - blockedAt
        - blockedUntil
      properties:
        id:
          type: string
          example: "1"
        ipAddress:
          type: string
          example: "203.0.113.9"
        reason:
          type: string
          enum: [rate_limit, max_errors, vulnerability_scan]
          description: >-
            Which configured threshold tripped the block: rate_limit
            (requests per minute), max_errors (401/404 responses), or
            vulnerability_scan (404s on a configured watched path).
          example: rate_limit
        path:
          type: string
          description: >-
            The request path that triggered the block. Only ever set for
            reason=vulnerability_scan; rate_limit and max_errors trip on
            an aggregate count across many requests/paths, not one
            specific path.
          example: "/admin.php"
        triggerCount:
          type: integer
          description: The relevant counter's value at the moment it crossed the configured threshold.
          example: 105
        blockedAt:
          type: string
          format: date-time
          example: "2026-03-05T18:29:00Z"
        blockedUntil:
          type: string
          format: date-time
          example: "2026-03-05T18:44:00Z"
        userAgent:
          type: string
          example: "curl/8.0"
        country:
          type: string
          example: "United States"
        countryCode:
          type: string
          example: "US"
        city:
          type: string
          example: "Ashburn"
        latitude:
          type: number
          nullable: true
          description: GPS latitude coordinate
        longitude:
          type: number
          nullable: true
          description: GPS longitude coordinate
        fingerprint:
          type: string
          description: See doc/middleware/ja4-fingerprint.md for what this is and its reliability caveats.
        fingerprintType:
          type: string
    BlockedClientsResponse:
      type: object
      required:
        - items
        - totalCount
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockedClient'
        totalCount:
          type: integer
          description: Total block events matching the filter, ignoring limit/offset — for pagination.
          example: 37
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    RateLimiterConfigResponse:
      type: object
      properties:
        requestsPerMinute:
          type: integer
          example: 60
        maxErrors:
          type: integer
          example: 10
        blockMinutes:
          type: integer
          example: 5
        vulnerabilityScan:
          type: object
          properties:
            urls:
              type: array
              items:
                type: string
            max404:
              type: integer
            blockMinutes:
              type: integer
          required:
            - urls
            - max404
            - blockMinutes
    MiddlewareHealth:
      type: object
      description: >-
        The result of a middleware's health check. Most built-in global
        middlewares are stateless per request and have nothing meaningful to
        check; status is "unknown" for those rather than a fabricated
        "healthy".
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
          example: "healthy"
        message:
          type: string
          example: "tracking 3 client IP(s), 0 currently blocked"
    MiddlewareStatusItem:
      type: object
      required:
        - name
        - description
        - status
        - enabled
        - dependencies
      properties:
        name:
          type: string
          example: "rate_limiter"
        description:
          type: string
          example: "Limits request rate per client IP and detects vulnerability scans"
        status:
          type: string
          enum: [active, available]
          description: '"active" if currently included in the running global chain, "available" if registered but not.'
          example: "active"
        enabled:
          type: boolean
        dependencies:
          type: array
          items:
            type: string
          description: Names of other middleware that must run earlier in the chain for this one to work.
        health:
          $ref: '#/components/schemas/MiddlewareHealth'
    MiddlewareStatusList:
      type: array
      items:
        $ref: '#/components/schemas/MiddlewareStatusItem'
    MiddlewareMetrics:
      type: object
      description: >-
        In-memory request metrics for one middleware, tracked since the
        process started (reset on restart). averageDurationMs is cumulative
        from entering this middleware to the response being written, so it
        includes every downstream middleware and the final handler — not this
        middleware's isolated cost.
      required:
        - name
        - requestCount
        - errorCount
        - averageDurationMs
      properties:
        name:
          type: string
          example: "logging"
        requestCount:
          type: integer
          format: int64
          example: 1024
        errorCount:
          type: integer
          format: int64
          description: Requests where the eventual response status was >= 500.
          example: 2
        averageDurationMs:
          type: number
          format: double
          example: 1.42
        lastInvokedAt:
          type: string
          format: date-time
          nullable: true
    MiddlewareMetricsList:
      type: array
      items:
        $ref: '#/components/schemas/MiddlewareMetrics'
    RequestStatistics:
      type: object
      properties:
        totalRequests:
          type: integer
          example: 12345
          description: Total number of requests
        requestsByStatus:
          type: object
          additionalProperties:
            type: integer
          example:
            200: 10000
            404: 1500
            500: 845
          description: Number of requests grouped by HTTP status code
        averageResponseTime:
          type: number
          format: float
          example: 125.5
          description: Average response time in milliseconds
        averageResponseSize:
          type: number
          format: float
          example: 2048.7
          description: Average response size in bytes
        requestsByCountry:
          type: object
          additionalProperties:
            type: integer
          example:
            US: 5000
            ES: 3000
            FR: 2000
            UK: 1500
            DE: 845
          description: Number of requests grouped by country code
        requestsByDeviceType:
          type: object
          additionalProperties:
            type: integer
          example:
            desktop: 8000
            mobile: 3500
            tablet: 800
            unknown: 45
          description: Number of requests grouped by device type
        requestsByPlatform:
          type: object
          additionalProperties:
            type: integer
          example:
            Windows: 5000
            Android: 3000
            iOS: 2000
            macOS: 1500
            Linux: 845
          description: Number of requests grouped by platform
        requestsByBrowser:
          type: object
          additionalProperties:
            type: integer
          example:
            Chrome: 7000
            Safari: 2500
            Firefox: 1800
            Edge: 1000
            Other: 45
          description: Number of requests grouped by browser
        requestsByUser:
          type: object
          additionalProperties:
            type: integer
          example:
            alice: 1200
            bob: 900
            guest: 300
          description: Number of requests grouped by user (username or user ID)
        requestsByFingerprint:
          type: object
          additionalProperties:
            type: integer
          example:
            "ge11nn05_9c68f7ca5aaf_d4bd6ad6f3ac": 1500
            "t13i1311h2_f57a46bbacb6_e5728521abd4": 800
            "8eeef6e7162cf91b": 500
          description: >-
            Number of requests grouped by client fingerprint
            (ClientInfo.Fingerprint) — the single consolidated value chosen
            per request among the three fingerprinting algorithms (see
            requestsByFingerprintType for the algorithm breakdown, and
            doc/middleware/ja4-fingerprint.md for what each algorithm is).
        requestsByFingerprintType:
          type: object
          additionalProperties:
            type: integer
          example:
            ja4_tls: 1200
            stable: 600
            ja4h: 200
          description: >-
            Number of requests grouped by which fingerprinting algorithm
            actually produced the value in requestsByFingerprint for that
            request: "ja4_tls" (TLS-level JA4, only possible when the
            gateway terminates TLS itself), "stable" (reduced-entropy
            header-based fingerprint), or "ja4h" (the noisiest, HTTP-header
            JA4H fingerprint).
      required:
        - totalRequests
        - requestsByStatus
        - averageResponseTime
        - averageResponseSize
        - requestsByCountry
        - requestsByDeviceType
        - requestsByPlatform
        - requestsByBrowser
        - requestsByUser
        - requestsByFingerprint
        - requestsByFingerprintType
    RequestDetail:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: The requested URL path
        user_id:
          type: string
          nullable: true
          description: ID of the authenticated user making the request
        username:
          type: string
          nullable: true
          description: Username of the authenticated user making the request
        status_code:
          type: integer
        response_time:
          type: number
        response_size:
          type: number
        country:
          type: string
        city:
          type: string
        latitude:
          type: number
          nullable: true
          description: GPS latitude coordinate
        longitude:
          type: number
          nullable: true
          description: GPS longitude coordinate
        device_type:
          type: string
        platform:
          type: string
        platform_version:
          type: string
          description: Version of the operating system/platform
        browser:
          type: string
        browser_version:
          type: string
          description: Version of the browser
        is_static:
          type: boolean
          description: Whether the request path looked like a static asset (see management.excludeStaticAssets)
        fingerprint:
          type: string
          description: >-
            The single consolidated client fingerprint value for this
            request (ClientInfo.Fingerprint) — see fingerprint_type for
            which algorithm produced it. Empty if none was available.
        fingerprint_type:
          type: string
          enum: ["ja4_tls", "stable", "ja4h", ""]
          description: >-
            Which fingerprinting algorithm produced the value in
            fingerprint: "ja4_tls" (TLS-level JA4, only possible when the
            gateway terminates TLS itself), "stable" (reduced-entropy
            header-based fingerprint), "ja4h" (HTTP-header JA4H
            fingerprint — the noisiest of the three), or "" if fingerprint
            is empty too.
      required:
        - id
        - timestamp
        - path
        - user_id
        - status_code
        - response_time
        - response_size
        - country
        - city
        - device_type
        - platform
        - platform_version
        - browser
        - browser_version
        - is_static
        - fingerprint
        - fingerprint_type
    RequestDetailsResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestDetail'
      required:
        - requests

    TimeSeriesGranularity:
      type: string
      enum: ["minute", "hour", "day", "week", "month"]

    TimeSeriesPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Start of this bucket, in UTC.
        requestCount:
          type: integer
          description: Total requests recorded in this bucket.
        uniqueFingerprints:
          type: integer
          description: >-
            Distinct client fingerprints (ClientInfo.Fingerprint) seen in
            this bucket — a proxy for unique visitors/devices, including
            anonymous ones. See doc/middleware/ja4-fingerprint.md for what
            "fingerprint" means here and its reliability caveats. Equal to
            newVisitors + returningVisitors.
        newVisitors:
          type: integer
          description: >-
            Of uniqueFingerprints, how many had their first-ever
            appearance (across this gateway's whole recorded history, not
            just the requested range) fall within this bucket.
        returningVisitors:
          type: integer
          description: >-
            Of uniqueFingerprints, how many were already known from an
            earlier bucket — possibly long before the requested range even
            started. uniqueFingerprints - newVisitors.
        uniqueUsers:
          type: integer
          description: Distinct authenticated user IDs seen in this bucket. Excludes anonymous traffic.
        errorCount:
          type: integer
          description: Requests with an HTTP status of 400 or higher in this bucket.
        averageResponseTime:
          type: number
          format: float
          description: Average response time in milliseconds for requests in this bucket. 0 if the bucket has no requests.
      required:
        - timestamp
        - requestCount
        - uniqueFingerprints
        - newVisitors
        - returningVisitors
        - uniqueUsers
        - errorCount
        - averageResponseTime

    TimeSeriesResponse:
      type: object
      properties:
        granularity:
          $ref: '#/components/schemas/TimeSeriesGranularity'
        points:
          type: array
          description: >-
            One point per bucket across the full requested range, in order,
            including zero-valued buckets for time windows with no
            recorded requests at all (a continuous series is easier to
            chart correctly than one with gaps).
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
      required:
        - granularity
        - points

    TokenResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the token
        name:
          type: string
          description: User-defined name for the token
        is_active:
          type: boolean
          description: Whether the token is active
        created_at:
          type: string
          format: date-time
          description: When the token was created
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token expires (null if no expiration)
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was last used
        usage_count:
          type: integer
          description: Number of times the token has been used
        scopes:
          type: array
          items:
            type: string
          description: Permissions/scopes for the token
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was revoked (null if not revoked)
      required:
        - id
        - name
        - is_active
        - created_at
        - usage_count
        - scopes

    TokenCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: User-defined name for the token
          minLength: 1
          maxLength: 100
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token should expire (null for no expiration)
        scopes:
          type: array
          items:
            type: string
          description: Permissions/scopes for the token
          default: []
      required:
        - name

    TokenCreateResponse:
      type: object
      properties:
        token:
          type: string
          description: The actual token string (only returned on creation)
        token_info:
          $ref: '#/components/schemas/TokenResponse'
      required:
        - token
        - token_info

    UserCountersResponse:
      type: object
      properties:
        user_id:
          type: string
          description: ID of the user
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
            type: string
            description: Username of the user
            example: "testuser"
        email:
            type: string
            format: email
            description: Email of the user
            example: "testuser@example.com"
        counter_id:
          type: string
          description: ID of the counter type
          example: "credits"
        balance:
          type: integer
          description: Current counter balance
          example: 1500
        last_updated:
          type: string
          format: date-time
          description: When the balance was last updated
          example: "2025-09-15T10:30:00Z"
        has_history:
          type: boolean
          description: Indicates if the user has any counter transaction history. False when user has no transactions and balance is default 0.
          example: true
      required:
        - user_id
        - counter_id
        - balance
        - last_updated
        - has_history

    CounterAdjustmentRequest:
      type: object
      properties:
        amount:
          type: integer
          description: Amount to add (positive) or deduct (negative)
          example: 100
        description:
          type: string
          description: Description of the counter adjustment
          maxLength: 255
          example: "Admin adjustment - promotional credits"
      required:
        - amount
        - description

    CounterTransactionResponse:
      type: object
      properties:
        id:
          type: string
          description: Transaction ID
          example: "456e7890-e12b-34c5-d678-901234567890"
        user_id:
          type: string
          description: ID of the user
          example: "123e4567-e89b-12d3-a456-426614174000"
        counter_id:
          type: string
          description: ID of the counter type
          example: "credits"
        amount:
          type: integer
          description: Amount added (positive) or deducted (negative)
          example: 100
        balance_after:
          type: integer
          description: Balance after this transaction
          example: 1600
        description:
          type: string
          description: Description of the transaction
          example: "Admin adjustment - promotional credits"
        created_at:
          type: string
          format: date-time
          description: When the transaction was created
          example: "2025-09-15T10:30:00Z"
      required:
        - id
        - user_id
        - counter_id
        - amount
        - balance_after
        - description
        - created_at

    CounterHistoryResponse:
      type: object
      properties:
        user_id:
          type: string
          description: ID of the user
          example: "123e4567-e89b-12d3-a456-426614174000"
        counter_id:
          type: string
          description: ID of the counter type
          example: "credits"
        current_balance:
          type: integer
          description: Current counter balance
          example: 1500
        has_history:
          type: boolean
          description: Indicates if the user has any counter transaction history. False when user has no transactions and balance is default 0.
          example: true
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/CounterTransactionResponse'
          description: List of counter transactions
        total_count:
          type: integer
          description: Total number of transactions (for pagination)
          example: 25
        limit:
          type: integer
          description: Maximum number of transactions returned
          example: 50
        offset:
          type: integer
          description: Number of transactions skipped
          example: 0
      required:
        - user_id
        - counter_id
        - current_balance
        - has_history
        - transactions
        - total_count
        - limit
        - offset

    AllUserCountersResponse:
      type: object
      properties:
        counter_id:
          type: string
          description: ID of the counter type
          example: "credits"
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserCountersResponse'
          description: List of users with their counter balances
        total_count:
          type: integer
          description: Total number of users (for pagination)
          example: 150
        limit:
          type: integer
          description: Maximum number of users returned
          example: 50
        offset:
          type: integer
          description: Number of users skipped
          example: 0
      required:
        - counter_id
        - users
        - total_count
        - limit
        - offset

    AvailableCountersResponse:
      type: object
      properties:
        counters:
          type: array
          items:
            type: string
          description: List of available counter type IDs
          example: ["credits", "coins", "points", "tokens"]
      required:
        - counters

    NotificationAction:
      type: object
      description: One possible answer to a notification, rendered as a Telegram button and an email link.
      properties:
        id:
          type: string
          description: Echoed back verbatim in Notification.respondedActionId once chosen.
          example: "approve"
        label:
          type: string
          example: "Approve"
        style:
          type: string
          description: Optional rendering hint, passed through as-is. Not a fixed enum.
          example: "primary"
      required:
        - id
        - label

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        batchId:
          type: string
          description: >
            Groups every recipient's notification from the same
            POST /api/notifications call — even a single-recipient call gets
            one. See GET /api/notifications/batches/{batchId}/status.
        type:
          type: string
          description: Caller-defined, opaque to the gateway.
          example: "music_track_added"
        title:
          type: string
        body:
          type: string
        url:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAction'
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        respondedActionId:
          type: string
          nullable: true
        respondedAt:
          type: string
          format: date-time
          nullable: true
        respondedVia:
          type: string
          nullable: true
          description: One of "web", "email", "telegram".
      required:
        - id
        - userId
        - batchId
        - type
        - title
        - body
        - createdAt

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Absent/null on the last page.
      required:
        - notifications

    NotificationDelivery:
      type: object
      description: One attempt to deliver a notification over one external channel.
      properties:
        id:
          type: string
        channel:
          type: string
          example: "email"
        status:
          type: string
          description: One of "sent", "failed", "skipped".
          example: "sent"
        error:
          type: string
          nullable: true
          description: Populated when status is "failed" or "skipped".
        attemptNumber:
          type: integer
          description: 1 for the first attempt, incrementing by one on each automatic retry.
        createdAt:
          type: string
          format: date-time
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
          description: When the next automatic retry is scheduled. Absent/null once sent, skipped, or once the retry schedule is exhausted.
      required:
        - id
        - channel
        - status
        - attemptNumber
        - createdAt

    CreateNotificationRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
          minItems: 1
          description: >
            One notification is created per user ID here, all sharing this
            same type/title/body/url/metadata/actions but each independently
            stored, delivered, read, and answered.
          example: ["user-abc", "user-def"]
        type:
          type: string
          example: "music_track_added"
        title:
          type: string
        body:
          type: string
        url:
          type: string
        metadata:
          type: object
          additionalProperties: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAction'
        channels:
          type: array
          items:
            type: string
          description: >
            External channels to attempt delivery on, for every recipient in
            userIds alike, e.g. ["email", "telegram"]. Omit to instead use
            each recipient's own preferred channel (see
            PUT /api/notifications/preferences), or, if they haven't set one,
            every channel this gateway has configured. An unconfigured or
            unknown channel is recorded as skipped, not an error — see
            NotificationDelivery in doc/notifications.md.
          example: ["email", "telegram"]
      required:
        - userIds
        - type
        - title
        - body

    CreateNotificationResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
          description: One entry per userIds, in the same order.
        batchId:
          type: string
          description: Pass to GET /api/notifications/batches/{batchId}/status for a rolled-up status across every recipient in this call.
      required:
        - notifications
        - batchId

    NotificationStatus:
      type: object
      description: >
        A notification's status, computed fresh from its delivery
        attempts: worst-first across its channels (pending beats failed
        beats sent). See doc/notifications.md's "Status" section for the
        exact rollup rule.
      properties:
        overall:
          type: string
          description: One of "sent", "failed", "pending".
          example: "pending"
        channels:
          type: object
          additionalProperties:
            type: string
          description: >
            Each channel this notification was attempted on, mapped to its
            own status: "sent", "failed", "pending", or "skipped" (a
            channel that was never usable for this user/config — excluded
            from `overall`'s rollup).
          example: {"email": "sent", "telegram": "pending"}
      required:
        - overall
        - channels

    NotificationBatchStatus:
      type: object
      description: A rolled-up status count across every recipient notified in one POST /api/notifications call.
      properties:
        batchId:
          type: string
        total:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
      required:
        - batchId
        - total
        - sent
        - failed
        - pending

    NotificationPreference:
      type: object
      properties:
        preferredChannel:
          type: string
          description: >
            The channel this user prefers, e.g. "email" or "telegram". Empty
            (or omitted, on the PUT request) means no preference — every
            configured channel is used instead.
          example: "telegram"

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tg_session_token # Ensure this is your actual session cookie name
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
